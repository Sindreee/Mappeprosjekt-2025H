# .github/workflows/ci.yml
# CI-oppsett kreditert threepp-prosjektet (https://github.com/markaren/threepp)
# Basert på deres Build-instruksjoner.

name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BUILD_DIR: build
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # --- Linux dependencies for OpenGL + X11 (needed by threepp GLFW) ---
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev

      # --- macOS dependencies ---
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake ninja

      # --- Windows dependencies ---
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja

      # --- Configure ---
      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # --- Build everything (including MappeoppgaveLib) ---
      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }}

      # --- Tests if you ever add them ---
      - name: Run tests
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure || echo "Ingen tester funnet"
        continue-on-error: true

      # --- Collect artifacts for debugging (optional) ---
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ env.BUILD_DIR }}/

