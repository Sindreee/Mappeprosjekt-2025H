name: C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- LINUX SETUP ---
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    # --- CONFIGURATION ---
    - name: Configure CMake
      # Vi lar CMake velge standard generator (Makefiles på Linux, Visual Studio på Windows)
      # Dette er mye tryggere enn å tvinge Ninja.
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # --- BUILDING ---
    - name: Build Project
      # --config Release er nødvendig for Windows (Multi-configuration generator)
      run: cmake --build build --config Release --parallel 4

    # --- TESTING ---
    - name: Run Tests
      # Vi navigerer inn i build-mappen og kjører ctest.
      # --output-on-failure gjør at vi ser feilmeldingen hvis en test feiler.
      # -C Release forteller Windows at den skal kjøre Release-versjonen.
      run: |
        cd build
        ctest -C Release --output-on-failure --verbose
